id = "ds-argus.selection-actions"
name = "Selection Actions"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Open selected HTTP(S) URLs or explicitly search selected text with your configured provider."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open selected HTTP(S) URL"
contexts = ["pane"]
command = ["python3", "open_url.py", "open"]

[[actions]]
id = "search"
title = "Search selected text with your configured provider"
contexts = ["pane"]
command = ["python3", "open_url.py", "search"]
