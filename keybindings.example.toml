# Merge these entries into Herdr config.toml; do not replace your existing config.
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "ds-argus.selection-actions.open"
description = "Open selected HTTP(S) URL"

# Explicitly sends the selected text to the configured search provider through your browser.
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "ds-argus.selection-actions.search"
description = "Search selected text"
